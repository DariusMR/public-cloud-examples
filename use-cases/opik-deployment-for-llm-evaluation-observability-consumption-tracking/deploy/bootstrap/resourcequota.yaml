apiVersion: v1
kind: ResourceQuota
metadata:
  name: opik-quota
  namespace: opik
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 24Gi
    limits.cpu: "16"
    limits.memory: 48Gi
    requests.ephemeral-storage: 40Gi
    limits.ephemeral-storage: 60Gi
    persistentvolumeclaims: "4"
    pods: "20"
    services: "10"
    secrets: "20"
