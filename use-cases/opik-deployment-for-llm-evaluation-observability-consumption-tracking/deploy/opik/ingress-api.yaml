apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opik-api
  namespace: opik
  # no cert-manager annotation: opik-ui already owns cert issuance for this shared host
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: opik-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: opik.<your-domain>      # replace <your-domain> with your actual domain name
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: opik-frontend
                port:
                  number: 5173
  tls:
    - hosts:
        - opik.<your-domain>      # replace <your-domain> with your actual domain name
      secretName: opik-tls
